name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [docs/product.md](../../blob/main/docs/product.md) 与 [docs/project-status.md](../../blob/main/docs/project-status.md)，
        确认该能力是否已实现或已被列为已知缺口。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实场景中的痛点，而不是直接给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或接口。如果涉及 LLM，请说明失败时如何降级。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - apps/api
        - apps/web
        - packages/domain
        - packages/contracts
        - packages/database
        - packages/llm
        - 测试 / CI
        - 文档
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 考虑过的其他做法，以及为什么没选它们。
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该建议不会让 LLM 直接写入业务事实（写库仍由确定性代码在事务中完成）
          required: false
        - label: 该建议不会引入真实凭据、真实候选人数据或内部基础设施信息
          required: true
